server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/f1-models/repo/app;
    index index.html;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}

